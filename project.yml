name: CamControl
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  CamControlCore:
    type: library.static
    platform: iOS
    sources:
      - path: CamControlCore/Sources
    dependencies:
      - sdk: ImageCaptureCore.framework
      - sdk: ImageIO.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicomposition.camcontrol.core
  CamControlApp:
    type: application
    platform: iOS
    sources:
      - path: CamControlApp/Sources
      - path: CamControlApp/Resources
        excludes:
          - Info.plist
    dependencies:
      - target: CamControlCore
      - sdk: AVFoundation.framework
      - sdk: ImageCaptureCore.framework
      - sdk: ImageIO.framework
    info:
      path: CamControlApp/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleDisplayName: Blackmagic Cam
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: BlackmagicCam
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "3.2.00"
        CFBundleVersion: "3.2.000045"
        NSBluetoothAlwaysUsageDescription: "Bluetooth access is required to support peripherals."
        NSCameraUsageDescription: "Access is required to preview and capture video."
        NSLocalNetworkUsageDescription: "Access is required to enable camera remote control."
        NSLocationWhenInUseUsageDescription: "Location access is needed to tag the GPS location of recorded videos."
        NSMicrophoneUsageDescription: "Access is required to monitor audio levels and record."
        NSPhotoLibraryUsageDescription: "Access is required to save videos to the Photo Library."
        NSPhotoLibraryAddUsageDescription: "Access is required to save videos to the Photo Library."
        LSApplicationCategoryType: public.app-category.video
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: CamControl
        PRODUCT_BUNDLE_IDENTIFIER: com.aicomposition.camcontrol
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  CamControlCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CamControlCoreTests/Sources
    dependencies:
      - target: CamControlCore
      - sdk: ImageCaptureCore.framework
      - sdk: ImageIO.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicomposition.camcontrol.tests
schemes:
  CamControl:
    build:
      targets:
        CamControlApp: all
        CamControlCore: all
        CamControlCoreTests: [test]
    test:
      targets:
        - CamControlCoreTests
