name: CamControl
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  CamControlCore:
    type: framework
    platform: iOS
    sources:
      - path: CamControlCore/Sources
    dependencies:
      - sdk: ImageCaptureCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicomposition.camcontrol.core
  CamControlApp:
    type: application
    platform: iOS
    sources:
      - path: CamControlApp/Sources
    resources:
      - path: CamControlApp/Resources
    dependencies:
      - target: CamControlCore
    info:
      path: CamControlApp/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicomposition.camcontrol
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  CamControlCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CamControlCoreTests/Sources
    dependencies:
      - target: CamControlCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicomposition.camcontrol.tests
schemes:
  CamControl:
    build:
      targets:
        CamControlApp: all
        CamControlCore: all
        CamControlCoreTests: [test]
    test:
      targets:
        - CamControlCoreTests
